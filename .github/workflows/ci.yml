name: CI

# Runs on every push and PR to main. Vercel and Render deploy automatically
# on push via their own GitHub integration — this workflow is the quality
# gate that runs before/alongside that.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # Explicit, rather than relying on @prisma/client's postinstall hook —
      # that hook doesn't reliably run in a fresh CI install.
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  client:
    name: Client (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
